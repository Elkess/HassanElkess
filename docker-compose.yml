services:
  mongodb:
    image: mongo:latest
    container_name: artist-portfolio-db
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: artist-portfolio

  backend:
    build: ./backend
    container_name: artist-portfolio-backend
    ports:
      - "5000:5000"
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/artist-portfolio
      - JWT_SECRET=your_jwt_secret_key_here
      - PORT=5000
      - CLIENT_URL=http://localhost:5173
      - NODE_ENV=development
    depends_on:
      - mongodb
    volumes:
      - ./backend:/app
      - /app/node_modules

  frontend:
    build: ./frontend
    container_name: artist-portfolio-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  mongodb_data:
